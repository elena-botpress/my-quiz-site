<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Культкод</title>
    <!-- Подгрузка шрифта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Основные настройки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0a0a0a; /* Глубокий черный фон */
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            gap: 3rem;
            place-items: center;
            text-align: center;
        }

        @media screen and (min-width: 768px) { /* Для планшетов и ПК */
            .container {
                grid-template-columns: repeat(3, 1fr);
                align-items: start;
            }
        }

        /* Элементы дизайна */
        h1 {
            grid-column: 1 / -1; /* Заголовок на всю ширину */
            font-size: clamp(2.5rem, 10vw, 5rem); /* Адаптивный размер заголовка */
            font-weight: 900;
            letter-spacing: 0.05em;
            line-height: 1.1;
            background: linear-gradient(to right, #ff69b4, #00ff7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .category {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        a.button {
            display: block;
            padding: 1.2rem 1.5rem;
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            color: white; /* ИСПРАВЛЕНО: теперь текст белый и видимый */
            position: relative;
            overflow: hidden;
        }

        /* Градиентный эффект при наведении */
        a.button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #ff69b4, #00ff7f);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        a.button:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: transparent;
            color: #0a0a0a; /* Текст становится темным на ярком фоне */
        }

        a.button:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Заголовок -->
    <h1>КУЛЬТКОД</h1>
    
    <!-- Блок Угадываем по звуку/кадру -->
    <div class="category">
        <div class="category-title">Угадай по кадру</div>
        <a class="button" href="https://movieguessr.net/quizzes/9b9abde0-404d-40fd-8fde-6cbab759f4db" target="_blank">ЭМОДЗИ</a>
        <a class="button" href="https://movieguessr.net/quizzes/4d3386a0-c5db-4750-8073-c91086817931" target="_blank">РУКА ПЕРСОНАЖА</a>
        <a class="button" href="https://moviehunter.ru/" target="_blank">ФРАГМЕНТ ИЗ ФИЛЬМА</a>
        <a class="button" href="https://ugadai-film.ru" target="_blank">МУЛЬТФИЛЬМ</a>
    </div>

    <!-- Блок Назад в СССР -->
    <div class="category">
        <div class="category-title">Назад в СССР</div>
        <a class="button" href="https://vk.ru/app54716918" target="_blank">БЫТ В СССР</a>
        <a class="button" href="https://vk.ru/app51539265" target="_blank">СТРАННЫЕ ПРЕДМЕТЫ</a>
        <a class="button" href="https://ugadai-film.ru" target="_blank">КИНО В СССР</a>
    </div>

    <!-- Блок Сюрприз -->
    <div class="category">
        <div class="category-title">Сюрприз</div>
        <a class="button" href="https://kinoguesser.ru" target="_blank">КОТ В МЕШКЕ</a>
        <a class="button" href="https://vk.ru/triviaroadsign" target="_blank">БЕРЕГИСЬ АВТОМОБИЛЯ</a>
    </div>

    <!-- Блок Викторины (разбил на две колонки на больших экранах для красоты) -->
    <div class="category" style="grid-column: span 2;">
        <div class="category-title">Популярные викторины</div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            <a class="button" href="https://yandex.ru/games/app/203046" target="_blank">УЭНЗДЕЙ</a>
            <a class="button" href="https://pikuco.ru/tests/49520" target="_blank">УЭНЗДЕЙ 2</a>
            <a class="button" href="https://blitzquiz.ru/kviz/slovo-pacana-viktorina-dlya-fanatov" target="_blank">СЛОВО ПАЦАНА</a>
            <a class="button" href="https://blitzquiz.ru/kviz/forsazh-viktorina-dlya-fanatov-franshizy" target="_blank">ФОРСАЖ</a>
            <a class="button" href="https://yandex.ru/games/app/437854" target="_blank">ГАРРИ ПОТТЕР</a>
            <a class="button" href="https://yandex.ru/games/app/sumerki-test-225270" target="_blank">СУМЕРКИ</a>
            <a class="button" href="https://pikuco.ru/tests/113532" target="_blank">DC</a>
            <a class="button" href="https://pikuco.ru/tests/14670" target="_blank">МСТИТЕЛИ</a>
            <a class="button" href="https://www.maximonline.ru/entertainment/horror-movies-test-id163310" target="_blank">УЖАСЫ</a>
            <a class="button" href="https://pikuco.ru/tests/1483" target="_blank">СМЕШАРИКИ</a>
        </div>
    </div>
</div>
</body>
</html>
