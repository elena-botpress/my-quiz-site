<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <style>
        /* Основные настройки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0a0a0a; /* Глубокий черный фон */
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 95vw;
            width: 100%;
            display: grid;
            gap: 2rem;
            place-items: center;
            text-align: center;
        }

        @media screen and (min-width: 768px) { /* Для планшетов и ПК */
            .container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Элементы дизайна */
        h1 {
            font-size: clamp(2rem, 10vw, 4rem); /* Адаптивный размер заголовка */
            letter-spacing: 0.1em;
            line-height: 1.2;
            mix-blend-mode: difference; /* Неоновый эффект */
            position: relative;
            z-index: 1;
        }
        h1::before,
        h1::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background-image: linear-gradient(to right, #ff69b4, #00ff7f);
            opacity: 0.2;
            pointer-events: none;
            z-index: -1;
        }
        h1::after {
            filter: blur(10px);
        }

        a.button {
            display: block;
            padding: 1.5rem 2rem;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            transition: transform 0.2s ease-in-out;
            text-decoration: none;
            color: inherit;
            target="_blank"; /* Открывать в новой вкладке */
        }
        a.button:hover {
            transform: scale(1.05);
        }

        /* Градиентный фон для кнопок */
        .category {
            --gradient-start: #ff69b4;
            --gradient-end: #00ff7f;
            background-image: linear-gradient(
                to right,
                var(--gradient-start),
                var(--gradient-end)
            );
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            mix-blend-mode: overlay;
        }
    </style>
</head>
