<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз: Сидим с бобром</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #B5C4A8 0%, #E8D98C 50%, #7A9E6B 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .loader-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #B5C4A8 0%, #E8D98C 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        .loader-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-beaver {
            font-size: 5rem;
            animation: bounce 0.8s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .loader-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2D4A2D;
            margin-top: 15px;
        }
        
        .screen-guess {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 40px 20px;
            text-align: center;
        }
        .guess-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: bold; color: #2D4A2D;
            margin-bottom: 30px; text-transform: uppercase;
        }
        .guess-cover {
            max-width: 700px; width: 100%;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(45, 74, 45, 0.3);
            margin-bottom: 30px; background: white;
            padding: 20px; border: 4px solid #8B5A2B;
        }
        .emoji-puzzle {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 20px;
        }
        .puzzle-hint {
            font-size: 1.2rem; color: #5C7A7A;
            margin-bottom: 30px; font-style: italic; max-width: 600px;
        }
        .btn-hint {
            background: linear-gradient(135deg, #7A9E6B, #5C7A7A);
            color: white; border: 3px solid #8B5A2B;
            padding: 20px 50px; font-size: 1.5rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(45, 74, 45, 0.4);
        }
        .btn-hint:hover {
            transform: translateY(-5px) scale(1.05);
        }
        .guess-options {
            display: none; flex-direction: column;
            gap: 15px; max-width: 600px; width: 100%; margin-top: 30px;
        }
        .guess-options.visible { display: flex; }
        .guess-option {
            background: white; border: 3px solid #7A9E6B;
            padding: 20px; border-radius: 20px;
            font-size: 1.2rem; font-weight: bold; color: #2D4A2D;
            cursor: pointer;
        }
        .guess-option:hover {
            background: #7A9E6B; color: white;
        }
        .guess-option.correct {
            background: #7A9E6B; border-color: #2D4A2D; color: white;
        }
        .guess-option.wrong {
            background: #B5C4A8; border-color: #8B5A2B; color: #8B5A2B;
        }
        .guess-option:disabled { cursor: not-allowed; }
        .success-message {
            display: none; font-size: 2.5rem; font-weight: bold;
            color: #2D4A2D; margin-top: 30px;
        }
        .success-message.visible { display: block; }
        
        .screen-quiz {
            display: none; min-height: 100vh;
            padding: 40px 20px;
        }
        .quiz-header { text-align: center; margin-bottom: 40px; }
        .quiz-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: bold; color: #2D4A2D;
            margin-bottom: 10px;
        }
        .quiz-progress {
            font-size: 1.2rem; color: #5C7A7A; font-weight: bold;
        }
        .quiz-container {
            display: flex; gap: 30px;
            max-width: 1400px; margin: 0 auto;
        }
        .quiz-left {
            flex: 0 0 40%; background: white;
            border-radius: 30px; padding: 30px;
            border: 3px solid #7A9E6B;
        }
        .quiz-question {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: bold; color: #2D4A2D;
            margin-bottom: 20px;
        }
        .quiz-options { display: flex; flex-direction: column; gap: 12px; }
        .quiz-option {
            background: linear-gradient(135deg, #B5C4A8, #E8D98C);
            border: 3px solid #7A9E6B;
            padding: 15px 20px; border-radius: 20px;
            font-size: 1rem; font-weight: bold; color: #2D4A2D;
            cursor: pointer;
            text-align: left;
        }
        .quiz-option:hover {
            background: linear-gradient(135deg, #7A9E6B, #5C7A7A);
            color: white;
        }
        .quiz-option.correct {
            background: linear-gradient(135deg, #7A9E6B, #2D4A2D);
            border-color: #2D4A2D; color: white;
        }
        .quiz-option.wrong {
            background: linear-gradient(135deg, #E8D98C, #8B5A2B);
            border-color: #8B5A2B; color: white;
        }
        .quiz-option:disabled { cursor: not-allowed; opacity: 0.7; }
        .quiz-right {
            flex: 1; background: white;
            border-radius: 30px; padding: 30px;
            min-height: 500px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border: 3px solid #7A9E6B;
        }
        .answer-placeholder {
            text-align: center; color: #5C7A7A; font-size: 1.2rem;
        }
        .answer-image {
            max-width: 100%; max-height: 600px;
            border-radius: 20px;
            border: 4px solid #8B5A2B;
        }
        .emoji-reaction {
            font-size: 8rem;
        }
        .btn-next {
            display: none; margin-top: 20px;
            background: linear-gradient(135deg, #7A9E6B, #5C7A7A);
            color: white; border: 3px solid #8B5A2B;
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
        }
        .btn-next:hover {
            transform: translateY(-3px) scale(1.05);
        }
        .btn-next.visible { display: block; }
        
        .screen-result {
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 40px 20px;
            text-align: center;
        }
        .result-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: bold; color: #2D4A2D;
            margin-bottom: 20px;
        }
        .result-score {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: bold; color: #7A9E6B;
            margin-bottom: 20px;
        }
        .result-message {
            font-size: 1.5rem; color: #5C7A7A;
            margin-bottom: 40px; max-width: 600px;
        }
        .btn-restart {
            background: linear-gradient(135deg, #7A9E6B, #5C7A7A);
            color: white; border: 3px solid #8B5A2B;
            padding: 20px 50px; font-size: 1.5rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
        }
        .btn-restart:hover {
            transform: translateY(-5px) scale(1.05);
        }
        .image-error {
            color: #8B5A2B; font-size: 1.2rem; font-weight: bold;
            padding: 20px; text-align: center;
            background: #E8D98C; border-radius: 15px;
            border: 2px solid #8B5A2B;
        }
        .celebration {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9998;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background: #7A9E6B;
            animation: confettiFall 3s ease-out forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        @media (max-width: 968px) {
            .quiz-container { flex-direction: column; }
            .quiz-left { flex: 1; width: 100%; }
            .quiz-right { flex: 1; width: 100%; }
            .guess-cover { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="loader-screen" id="loaderScreen">
        <div class="loader-beaver">🦫</div>
        <div class="loader-text">Бобёр готовится...</div>
    </div>

    <div class="screen-guess" id="screenGuess">
        <h1 class="guess-title">Угадай песню!</h1>
        <img src="cover.png" alt="Сидим с бобром за столом" class="guess-cover" onerror="this.style.display='none'">
        <div class="emoji-puzzle">🪑 +  + 🪵 + 🥃 +  + 😌 = ❓</div>
        <p class="puzzle-hint">Это не инструкция по выживанию в тайге и не рецепт коктейля... Нажмите на подсказку!</p>
        <button class="btn-hint" id="btnHint" onclick="showOptions()">💡 Подсказка</button>
        <div class="guess-options" id="guessOptions">
            <button class="guess-option" onclick="checkGuess(this, false)">🌲 «Лесорубы в депрессии»</button>
            <button class="guess-option" onclick="checkGuess(this, false)">🏕️ «Как я провел лето с грызуном»</button>
            <button class="guess-option" onclick="checkGuess(this, false)">🎵 «Хиты Алсу для фагота»</button>
            <button class="guess-option" onclick="checkGuess(this, true)">✅ «Сидим с бобром за столом»</button>
        </div>
        <div class="success-message" id="successMessage">✅ Правильно! Переходим к викторине...</div>
    </div>

    <div class="screen-quiz" id="screenQuiz">
        <div class="quiz-header">
            <h1 class="quiz-title">🦫 Квиз: Сидим с бобром</h1>
            <div class="quiz-progress">Вопрос <span id="currentQuestion">1</span> из <span id="totalQuestions">15</span></div>
        </div>
        <div class="quiz-container">
            <div class="quiz-left">
                <div class="quiz-question" id="questionText"></div>
                <div class="quiz-options" id="optionsContainer"></div>
                <button class="btn-next" id="btnNext" onclick="nextQuestion()">Следующий вопрос →</button>
            </div>
            <div class="quiz-right" id="answerArea">
                <div class="answer-placeholder">
                    <div style="font-size: 4rem; margin-bottom: 20px;">🌲</div>
                    <div>Здесь появится ответ!</div>
                </div>
            </div>
        </div>
    </div>

    <div class="screen-result" id="screenResult">
        <h1 class="result-title">🌲 Результаты</h1>
        <div class="result-score"><span id="scoreCorrect">0</span> / <span id="scoreTotal">15</span></div>
        <div class="result-message" id="resultMessage"></div>
        <button class="btn-restart" onclick="restartQuiz()">🔄 Пройти ещё раз</button>
    </div>

    <div class="celebration" id="celebration"></div>

    <audio id="audio1"><source src="1.mp3" type="audio/mpeg"></audio>
    <audio id="audio2"><source src="2.mp3" type="audio/mpeg"></audio>
    <audio id="audio3"><source src="3.mp3" type="audio/mpeg"></audio>
    <audio id="audio4"><source src="4.mp3" type="audio/mpeg"></audio>
    <audio id="audio7"><source src="7.mp3" type="audio/mpeg"></audio>
    <audio id="audio8"><source src="8.mp3" type="audio/mpeg"></audio>
    <audio id="audio9"><source src="9.mp3" type="audio/mpeg"></audio>
    <audio id="audio14"><source src="14.mp3" type="audio/mpeg"></audio>
    <audio id="audioEnd"><source src="end.mp3" type="audio/mpeg"></audio>

    <script>
        // Показываем страницу сразу, без ожидания загрузки
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loaderScreen').classList.add('hidden');
            }, 1500);
        });

        const questions = [
            { question: "Где именно находятся лирический герой и бобёр в самом начале песни?", options: ["В бобровой хатке с видом на реку", "На пне в глухом лесу", "За столом", "В баре «У дяди Бобра»"], correct: 2, image: "q01-table.png", audio: "audio1" },
            { question: "Что они готовят вдвоём на ужин?", options: ["Суши из коры и мха", "Полено", "Борщ с бобровым хвостом", "Пасту карбонара (без глютена)"], correct: 1, image: "q02-log.png", audio: "audio2" },
            { question: "О чём лирический герой предлагает поговорить бобру?", options: ["О курсе криптовалют и биткоине", "О том, что наболело", "О глобальном потеплении и экологии", "О новых правилах парковки во дворе"], correct: 1, image: "q03-conversation.png", audio: "audio3" },
            { question: "Какой главный философский вопрос герой задаёт бобру?", options: ["«Скажи, зачем же между нами плотина?»", "«Кто подставил кролика Роджера?»", "«Быть или не быть, вот в чём вопрос»", "«Где взять деньги на ипотеку?»"], correct: 0, image: "q04-dam.png", audio: "audio4" },
            { question: "Какое ещё препятствие, кроме плотины, упоминается между ними в песне?", options: ["Высокий забор из профнастила", "Обрыв", "Очередь в поликлинику", "Стена из взаимного непонимания"], correct: 1, image: "q05-cliff.png", audio: null },
            { question: "Какое удивительное свойство бобров с восторгом отмечает лирический герой?", options: ["Они умеют летать на небольших расстояниях", "Они так добры", "Они знают язык программирования Python", "Они официально не платят налоги"], correct: 1, image: "q06-kind.png", audio: null },
            { question: "Чем, помимо готовки полена, занимаются герой и бобёр вместе?", options: ["Играют в шахматы на время", "Поют с бобром хиты Алсу", "Строят атомную электростанцию", "Смотрят сериал «Слово пацана»"], correct: 1, image: "q07-singing.png", audio: "audio7" },
            { question: "Какое чувство испытывает лирический герой, находясь рядом с бобром?", options: ["Ему так офигенно", "Лёгкая ностальгическая грусть", "Экзистенциальный ужас", "Сильное желание спать"], correct: 0, image: "q08-hug.png", audio: "audio8" },
            { question: "Какие напитки упоминаются в одной из версий текста, когда они сидят за столом?", options: ["Чай с малиной и мёдом", "Текила и ром", "Квас «Очаковский»", "Смузи из хвои и шишек"], correct: 1, image: "q09-drinks.png", audio: "audio9" },
            { question: "Как лучше всего охарактеризовать музыкальный жанр этого шедевра?", options: ["Симфоническая опера в трёх актах", "Норвежский блэк-метал", "Мемный поп-хит / лирический шансон", "Японский традиционный фольклор"], correct: 2, image: "q10-music.png", audio: null },
            { question: "Если бы бобёр реально ответил на вопрос «зачем между нами плотина?», что бы он сказал с точки зрения биологии?", options: ["Чтобы создать запруду и защитить свою хатку от хищников", "Потому что он тайно ненавидит лирического героя", "Это его новый арт-объект для выставки современного искусства", "Он просто потерял ключи от калитки"], correct: 0, image: "q11-building.png", audio: null },
            { question: "Какое животное является главной музой и соведущим этой песни?", options: ["Выдра", "Бобёр", "Енот-полоскун", "Капибара"], correct: 1, image: "q12-portrait.png", audio: null },
            { question: "Чего лирический герой ТОЧНО НЕ делает с бобром в этой песне?", options: ["Не готовит полено", "Не разговаривает о наболевшем", "Не оформляет совместную ипотеку на хатку", "Не поёт хиты Алсу"], correct: 2, image: "q13-mortgage.png", audio: null },
            { question: "Какая фраза из песни лучше всего описывает уровень доверия между героем и бобром?", options: ["«Скажи мне честно, бобёр»", "«Дай в долг до пятницы, бобёр»", "«Не верь, не бойся, не проси, бобёр»", "«Ты кто такой? Давай, до свидания!»"], correct: 0, image: "q14-trust.png", audio: "audio14" },
            { question: "Какой главный жизненный вывод можно сделать, прослушав эту песню?", options: ["Бобры – это опасные хищники, держитесь от них подальше", "Дружба с бобром – это офигенно", "Нужно срочно идти и строить плотину", "Полено – это новый чёрный"], correct: 1, image: "q15-cinema.png", audio: null }
        ];

        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        const emojiReactions = ['😡', '😞', '😂', '😢', '😭', '🤕', '😅', '🙈', '😿', '💔'];

        function showOptions() {
            document.getElementById('guessOptions').classList.add('visible');
            document.getElementById('btnHint').style.display = 'none';
        }

        function checkGuess(button, isCorrect) {
            const allButtons = document.querySelectorAll('.guess-option');
            allButtons.forEach(btn => btn.disabled = true);
            if (isCorrect) {
                button.classList.add('correct');
                document.getElementById('successMessage').classList.add('visible');
                setTimeout(() => { startQuiz(); }, 2000);
            } else {
                button.classList.add('wrong');
                setTimeout(() => {
                    allButtons.forEach(btn => { btn.disabled = false; btn.classList.remove('wrong'); });
                }, 1000);
            }
        }

        function startQuiz() {
            document.getElementById('screenGuess').style.display = 'none';
            document.getElementById('screenQuiz').style.display = 'block';
            document.getElementById('totalQuestions').textContent = questions.length;
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('questionText').textContent = q.question;
            const btnNext = document.getElementById('btnNext');
            if (currentQuestionIndex === questions.length - 1) {
                btnNext.style.display = 'none';
            } else {
                btnNext.style.display = '';
            }
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            document.getElementById('answerArea').innerHTML = `
                <div class="answer-placeholder">
                    <div style="font-size: 4rem; margin-bottom: 20px;">🌲</div>
                    <div>Здесь появится ответ!</div>
                </div>
            `;
        }

        function checkAnswer(selectedIndex, button) {
            const q = questions[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.quiz-option');
            allButtons.forEach(btn => btn.disabled = true);
            const isLastQuestion = (currentQuestionIndex === questions.length - 1);
            
            if (selectedIndex === q.correct) {
                button.classList.add('correct');
                correctAnswers++;
                document.getElementById('answerArea').innerHTML = `
                    <img src="${q.image}" alt="Ответ" class="answer-image" onerror="this.outerHTML='<div class=image-error>Картинка не загрузилась: ${q.image}</div>'">
                `;
                if (isLastQuestion) {
                    playEndMusic();
                    setTimeout(() => showResult(), 4000);
                } else if (q.audio) {
                    const audio = document.getElementById(q.audio);
                    if (audio) {
                        audio.currentTime = 0;
                        audio.play().catch(e => console.log('Аудио:', e));
                    }
                    document.getElementById('btnNext').classList.add('visible');
                } else {
                    document.getElementById('btnNext').classList.add('visible');
                }
            } else {
                button.classList.add('wrong');
                allButtons[q.correct].classList.add('correct');
                const randomEmoji = emojiReactions[Math.floor(Math.random() * emojiReactions.length)];
                document.getElementById('answerArea').innerHTML = `<div class="emoji-reaction">${randomEmoji}</div>`;
                if (isLastQuestion) {
                    playEndMusic();
                    setTimeout(() => showResult(), 4000);
                } else {
                    document.getElementById('btnNext').classList.add('visible');
                }
            }
        }

        function playEndMusic() {
            const endAudio = document.getElementById('audioEnd');
            if (endAudio) {
                endAudio.currentTime = 0;
                endAudio.play().catch(e => console.log('Финальная музыка:', e));
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function createCelebration() {
            const celebration = document.getElementById('celebration');
            const colors = ['#7A9E6B', '#5C7A7A', '#E8D98C', '#8B5A2B', '#2D4A2D'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    celebration.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        function showResult() {
            document.getElementById('screenQuiz').style.display = 'none';
            document.getElementById('screenResult').style.display = 'flex';
            document.getElementById('scoreCorrect').textContent = correctAnswers;
            document.getElementById('scoreTotal').textContent = questions.length;
            createCelebration();
            const endAudio = document.getElementById('audioEnd');
            if (endAudio) {
                endAudio.currentTime = 0;
                endAudio.play().catch(e => console.log('Финальная музыка:', e));
            }
            let message = '';
            const percentage = (correctAnswers / questions.length) * 100;
            if (percentage === 100) message = '🌲 Идеально! Ты настоящий бобровед! Бобёр тобой гордится! ✨';
            else if (percentage >= 80) message = '🌟 Отлично! Ты почти так же офигенно, как бобёр!';
            else if (percentage >= 60) message = '👍 Неплохо! Но бобёр ожидает от тебя большего!';
            else if (percentage >= 40) message = '😅 Ну такое... Пора переслушать песню раз 100!';
            else message = '😱 Ой-ой... Бобёр расстроен! Срочно иди слушать песню!';
            document.getElementById('resultMessage').textContent = message;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            correctAnswers = 0;
            document.getElementById('screenResult').style.display = 'none';
            document.getElementById('screenGuess').style.display = 'flex';
            document.getElementById('guessOptions').classList.remove('visible');
            document.getElementById('btnHint').style.display = 'block';
            document.getElementById('successMessage').classList.remove('visible');
            document.querySelectorAll('.guess-option').forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('correct', 'wrong');
            });
            const endAudio = document.getElementById('audioEnd');
            if (endAudio) {
                endAudio.pause();
                endAudio.currentTime = 0;
            }
        }
    </script>
</body>
</html>
