<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Угадай мелодию!</title>
    <style>
        /* --- СТИЛИ (Оптимизировано под полный экран) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif; 
            background: linear-gradient(135deg, #B5C4A8 0%, #E8D98C 50%, #7A9E6B 100%); 
            min-height: 100vh; 
            overflow-x: hidden; 
            color: #2D4A2D;
            display: flex;
            flex-direction: column;
        }

        /* ЭКРАН 1: ИНТРО */
        .screen-intro { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            text-align: center; 
        }
        .intro-title { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 900; margin-bottom: 20px; text-shadow: 2px 2px 0px rgba(255,255,255,0.5); }
        .intro-cover { max-width: 450px; width: 90%; border-radius: 25px; box-shadow: 0 15px 40px rgba(45,74,45,0.3); margin-bottom: 20px; border: 6px solid #fff; background: white; }
        
        .emoji-puzzle { font-size: clamp(2.5rem, 6vw, 4rem); margin-bottom: 15px; letter-spacing: 15px; }
        .puzzle-hint { font-size: 1.3rem; color: #5C7A7A; margin-bottom: 30px; font-style: italic; font-weight: bold; }
        
        .btn-hint { background: linear-gradient(135deg, #7A9E6B, #5C7A7A); color: white; border: 3px solid #8B5A2B; padding: 18px 50px; font-size: 1.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 30px rgba(45,74,45,0.4); transition: all 0.3s; }
        .btn-hint:hover { transform: translateY(-3px) scale(1.05); background: linear-gradient(135deg, #5C7A7A, #2D4A2D); }
        
        .guess-options { display: none; flex-direction: column; gap: 15px; max-width: 600px; width: 100%; margin-top: 20px; }
        .guess-options.visible { display: flex; }
        .guess-option { background: white; border: 3px solid #7A9E6B; padding: 18px; border-radius: 20px; font-size: 1.3rem; font-weight: bold; color: #2D4A2D; cursor: pointer; transition: all 0.2s; }
        .guess-option:hover { background: #7A9E6B; color: white; transform: scale(1.02); }
        .guess-option.correct { background: #7A9E6B; border-color: #2D4A2D; color: white; }
        .guess-option.wrong { background: #B5C4A8; border-color: #8B5A2B; color: #8B5A2B; }
        .guess-option:disabled { cursor: not-allowed; opacity: 0.8; }
        
        .success-message { display: none; font-size: 2rem; font-weight: 900; color: #2D4A2D; margin-top: 30px; animation: bounceIn 0.6s; }
        .success-message.visible { display: block; }

        /* ЭКРАН 2: ВИКТОРИНА (Максимально заполненный) */
        .screen-quiz { 
            display: none; 
            min-height: 100vh; 
            padding: 20px; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; /* Центрируем по вертикали */
        }
        .quiz-header { text-align: center; margin-bottom: 20px; color: #2D4A2D; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .quiz-container { 
            display: flex; 
            gap: 30px; 
            width: 100%; 
            max-width: 1400px; 
            height: 75vh; /* Фиксируем высоту, чтобы не прыгало */
            align-items: stretch; 
        }
        
        .player-card { 
            background: #fff; 
            padding: 30px; 
            border-radius: 30px; 
            flex: 1; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            border: 4px solid #7A9E6B; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; /* Распределяем контент */
        }
        
        .question-text { font-size: clamp(1.2rem, 2.5vw, 1.8rem); color: #2D4A2D; font-weight: 900; line-height: 1.3; text-align: center; margin-bottom: 20px; }
        
        .options-grid { display: grid; gap: 15px; width: 100%; flex-grow: 1; }
        
        .option-btn { 
            background: #f0f4f8; 
            border: 3px solid #B5C4A8; 
            padding: 15px 20px; 
            border-radius: 20px; 
            font-size: clamp(1rem, 1.5vw, 1.3rem); 
            cursor: pointer; 
            transition: all 0.2s; 
            color: #2D4A2D; 
            font-weight: bold; 
            text-align: left; 
            display: flex;
            align-items: center;
        }
        .option-btn:hover:not(:disabled) { background: #E8D98C; border-color: #8B5A2B; transform: translateX(5px); }
        .option-btn.correct { background: #7A9E6B !important; color: white !important; border-color: #2D4A2D !important; }
        .option-btn.wrong { background: #ffcccc !important; color: #a00 !important; border-color: #ffaaaa !important; }
        .option-btn:disabled { cursor: default; opacity: 0.9; }

        .answer-panel { 
            flex: 1; 
            background: #fff; 
            border-radius: 30px; 
            padding: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            border: 4px solid #7A9E6B; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }
        .answer-image { max-width: 100%; max-height: 100%; border-radius: 20px; animation: fadeIn 0.5s; object-fit: contain; border: 4px solid #8B5A2B; }
        .answer-placeholder { text-align: center; color: #5C7A7A; font-size: 1.5rem; font-weight: bold; }
        .emoji-reaction { font-size: 8rem; animation: bounceIn 0.6s; }

        .btn-next { 
            margin-top: 20px; 
            background: #2D4A2D; 
            color: white; 
            border: none; 
            padding: 15px 50px; 
            border-radius: 30px; 
            font-size: 1.4rem; 
            cursor: pointer; 
            display: none; 
            font-weight: bold; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            align-self: center;
            width: 100%;
        }
        .btn-next:hover { background: #3e633e; transform: scale(1.02); }

        /* ЭКРАН 3: ФИНАЛ */
        .screen-result { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        .result-score { font-size: 6rem; color: #2D4A2D; font-weight: 900; margin: 20px 0; }
        .result-msg { font-size: 1.8rem; color: #2D4A2D; margin-bottom: 40px; max-width: 800px; line-height: 1.4; font-weight: bold; }
        .btn-restart { background: #2D4A2D; color: #fff; border: none; padding: 20px 60px; font-size: 1.8rem; border-radius: 50px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 5px 15px rgba(45,74,45,0.4); font-weight: bold; }
        .btn-restart:hover { transform: scale(1.05); background: #3e633e; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 50% { transform: scale(1.1); } 70% { transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

        @media (max-width: 968px) {
            .quiz-container { flex-direction: column; height: auto; }
            .player-card { margin-bottom: 20px; }
            .answer-panel { min-height: 300px; }
            .intro-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ОБЛОЖКА + ЭМОДЗИ-ЗАГАДКА -->
    <div class="screen-intro" id="screenIntro">
        <h1 class="intro-title">🎧 Угадай песню!</h1>
        <img src="cover.png" alt="Music Quiz" class="intro-cover"> 
        
        <div class="emoji-puzzle">🪑 + 🦫 + 🥃 + 🎤 + 😌 = ❓</div>
        <p class="puzzle-hint">Это не инструкция по выживанию в тайге... Нажмите на подсказку!</p>
        
        <button class="btn-hint" id="btnHint" onclick="showGuessOptions()">💡 Подсказка</button>
        
        <div class="guess-options" id="guessOptions">
            <button class="guess-option" onclick="checkGuess(this, false)"> «Лесорубы в депрессии»</button>
            <button class="guess-option" onclick="checkGuess(this, false)">️ «Как я провел лето с грызуном»</button>
            <button class="guess-option" onclick="checkGuess(this, true)">✅ «Сидим с бобром за столом»</button>
            <button class="guess-option" onclick="checkGuess(this, false)">🎵 «Хиты Алсу для фагота»</button>
        </div>
        
        <div class="success-message" id="successMessage">✅ Правильно! Переходим к викторине...</div>
    </div>

    <!-- ЭКРАН 2: ВОПРОСЫ -->
    <div class="screen-quiz" id="screenQuiz">
        <div class="quiz-header">
            Вопрос <span id="qCurrent">1</span> из <span id="qTotal">15</span>
        </div>
        
        <div class="quiz-container">
            <div class="player-card">
                <div class="question-text" id="questionText"></div>
                <div class="options-grid" id="optionsContainer"></div>
                <button class="btn-next" id="btnNext" onclick="nextQuestion()">Дальше ➡</button>
            </div>
            
            <div class="answer-panel" id="answerPanel">
                <div class="answer-placeholder">
                    <div style="font-size: 5rem; margin-bottom: 20px;"></div>
                    <div>Здесь появится ответ!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: ФИНАЛ -->
    <div class="screen-result" id="screenResult">
        <h1 style="font-size: 4rem; color: #2D4A2D;">🎉 Квиз завершен!</h1>
        <div class="result-score"><span id="finalScore">0</span> / <span id="totalScore">15</span></div>
        <p id="finalMessage" class="result-msg"></p>
        <button class="btn-restart" onclick="restartQuiz()">🔄 Сыграть ещё раз</button>
    </div>

    <!-- СКРИПТ ЛОГИКИ -->
    <script>
        // === БАЗА ДАННЫХ ВОПРОСОВ (ВСЕ 15) ===
        // correct: 2 - это третий вариант, 3 - четвертый вариант.
        const quizData = [
            { question: "Где именно находятся лирический герой и бобёр в самом начале песни?", audioFile: '1.mp3', image: 'q01-table.png', correct: 2, options: ['В бобровой хатке с видом на реку', 'На пне в глухом лесу', 'За столом', 'В баре «У дяди Бобра»'] },
            { question: "Что они готовят вдвоём на ужин?", audioFile: '2.mp3', image: 'q02-log.png', correct: 3, options: ['Суши из коры и мха', 'Борщ с бобровым хвостом', 'Пасту карбонара (без глютена)', 'Полено'] },
            { question: "О чём лирический герой предлагает поговорить бобру?", audioFile: '3.mp3', image: 'q03-conversation.png', correct: 2, options: ['О курсе криптовалют и биткоине', 'О глобальном потеплении', 'О том, что наболело', 'О новых правилах парковки'] },
            { question: "Какой главный философский вопрос герой задаёт бобру?", audioFile: '4.mp3', image: 'q04-dam.png', correct: 3, options: ['«Кто подставил кролика Роджера?»', '«Быть или не быть?»', '«Где взять деньги на ипотеку?»', '«Скажи, зачем же между нами плотина?»'] },
            { question: "Какое ещё препятствие упоминается между ними в песне?", audioFile: '5.mp3', image: 'q05-cliff.png', correct: 2, options: ['Высокий забор из профнастила', 'Очередь в поликлинику', 'Обрыв', 'Стена из взаимного непонимания'] },
            { question: "Какое удивительное свойство бобров отмечает лирический герой?", audioFile: '6.mp3', image: 'q06-kind.png', correct: 3, options: ['Они умеют летать', 'Они знают Python', 'Они не платят налоги', 'Они так добры'] },
            { question: "Чем, помимо готовки полена, занимаются герой и бобёр вместе?", audioFile: '7.mp3', image: 'q07-singing.png', correct: 2, options: ['Играют в шахматы', 'Строят АЭС', 'Поют с бобром хиты Алсу', 'Смотрят сериалы'] },
            { question: "Какое чувство испытывает лирический герой рядом с бобром?", audioFile: '8.mp3', image: 'q08-hug.png', correct: 3, options: ['Ностальгическую грусть', 'Экзистенциальный ужас', 'Сильное желание спать', 'Ему так офигенно'] },
            { question: "Какие напитки упоминаются в одной из версий текста?", audioFile: '9.mp3', image: 'q09-drinks.png', correct: 2, options: ['Чай с малиной', 'Квас «Очаковский»', 'Текила и ром', 'Смузи из хвои'] },
            { question: "Как лучше всего охарактеризовать жанр этого шедевра?", audioFile: '10.mp3', image: 'q10-music.png', correct: 3, options: ['Симфоническая опера', 'Норвежский блэк-метал', 'Японский фольклор', 'Мемный поп-хит / шансон'] },
            { question: "Если бы бобёр ответил биологически, зачем ему плотина?", audioFile: '11.mp3', image: 'q11-building.png', correct: 2, options: ['Он ненавидит героя', 'Это арт-объект', 'Защитить хатку от хищников', 'Потерял ключи'] },
            { question: "Какое животное является главной музой этой песни?", audioFile: '12.mp3', image: 'q12-portrait.png', correct: 3, options: ['Выдра', 'Енот-полоскун', 'Капибара', 'Бобёр'] },
            { question: "Чего герой ТОЧНО НЕ делает с бобром в этой песне?", audioFile: '13.mp3', image: 'q13-mortgage.png', correct: 2, options: ['Не готовит полено', 'Не разговаривает о наболевшем', 'Не оформляет совместную ипотеку', 'Не поёт хиты Алсу'] },
            { question: "Какая фраза лучше всего описывает уровень доверия?", audioFile: '14.mp3', image: 'q14-trust.png', correct: 3, options: ['«Дай в долг до пятницы»', '«Не верь, не бойся»', '«Ты кто такой? Давай, до свидания!»', '«Скажи мне честно, бобёр»'] },
            { question: "Какой главный жизненный вывод можно сделать из песни?", audioFile: '15.mp3', image: 'q15-cinema.png', correct: 2, options: ['Бобры – опасные хищники', 'Нужно строить плотину', 'Дружба с бобром – это офигенно', 'Полено – это новый чёрный'] }
        ];

        let currentQ = 0;
        let score = 0;
        let currentAudio = new Audio(); 

        // --- ЛОГИКА ИНТРО ---
        function showGuessOptions() { 
            document.getElementById('guessOptions').classList.add('visible'); 
            document.getElementById('btnHint').style.display = 'none'; 
        }
        
        function checkGuess(button, isCorrect) {
            const allButtons = document.querySelectorAll('.guess-option');
            allButtons.forEach(btn => btn.disabled = true);
            
            if (isCorrect) {
                button.classList.add('correct');
                document.getElementById('successMessage').classList.add('visible');
                setTimeout(() => { 
                    document.getElementById('screenIntro').style.display = 'none'; 
                    document.getElementById('screenQuiz').style.display = 'flex'; 
                    document.getElementById('qTotal').innerText = quizData.length;
                    document.getElementById('totalScore').innerText = quizData.length;
                    loadQuestion(); 
                }, 1500);
            } else {
                button.classList.add('wrong');
                setTimeout(() => { 
                    allButtons.forEach(btn => { btn.disabled = false; btn.classList.remove('wrong'); }); 
                }, 800);
            }
        }

        // --- ЛОГИКА ВИКТОРИНЫ ---
        function loadQuestion() {
            const data = quizData[currentQ];
            document.getElementById('qCurrent').innerText = currentQ + 1;
            document.getElementById('questionText').innerText = data.question;
            document.getElementById('btnNext').style.display = 'none';
            
            // Сброс панели ответов
            document.getElementById('answerPanel').innerHTML = `
                <div class="answer-placeholder">
                    <div style="font-size: 5rem; margin-bottom: 20px;"></div>
                    <div>Здесь появится ответ!</div>
                </div>`;
            
            // Генерация кнопок
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            const data = quizData[currentQ];
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === data.correct) {
                btnElement.classList.add('correct');
                score++;
                // Показываем картинку И включаем музыку
                document.getElementById('answerPanel').innerHTML = `<img src="${data.image}" alt="Ответ" class="answer-image" onerror="this.outerHTML='<div style=\'color:#8B5A2B;font-weight:bold;text-align:center;\'>️ Картинка не загрузилась</div>'">`;
                
                currentAudio.src = data.audioFile;
                currentAudio.play().catch(e => console.log("Ошибка аудио:", e));
                
            } else {
                btnElement.classList.add('wrong');
                buttons[data.correct].classList.add('correct');
                // При неправильном - эмодзи
                document.getElementById('answerPanel').innerHTML = `<div class="emoji-reaction">😞</div>`;
            }
            
            document.getElementById('btnNext').style.display = 'block';
        }

        function nextQuestion() {
            currentAudio.pause(); // Останавливаем музыку перед следующим вопросом
            currentQ++;
            if (currentQ < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('screenQuiz').style.display = 'none';
            document.getElementById('screenResult').style.display = 'flex';
            document.getElementById('finalScore').innerText = score;
            
            const msg = document.getElementById('finalMessage');
            const percentage = (score / quizData.length) * 100;
            
            if(percentage === 100) msg.innerText = "🎸 Идеально! Ты настоящий бобровед!";
            else if(percentage >= 80) msg.innerText = "✨ Отлично! Бобер тобой гордится!";
            else if(percentage >= 50) msg.innerText = " Неплохо, но можно лучше!";
            else msg.innerText = "🥁 Попробуй еще раз, послушай песню внимательнее!";
        }

        function restartQuiz() {
            currentQ = 0;
            score = 0;
            currentAudio.pause();
            document.getElementById('screenResult').style.display = 'none';
            document.getElementById('screenIntro').style.display = 'flex';
            document.getElementById('guessOptions').classList.remove('visible');
            document.getElementById('btnHint').style.display = 'block';
            document.getElementById('successMessage').classList.remove('visible');
            document.querySelectorAll('.guess-option').forEach(btn => { 
                btn.disabled = false; 
                btn.classList.remove('correct', 'wrong'); 
            });
        }
    </script>
</body>
</html>
