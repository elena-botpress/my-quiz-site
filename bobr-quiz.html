<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест викторины</title>
    <style>
        body { font-family: Arial; background: #B5C4A8; padding: 20px; }
        .btn { background: #7A9E6B; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; margin: 10px; display: block; }
        .correct { background: #2D6A4F !important; }
        .wrong { background: #E63946 !important; }
        .question { background: white; padding: 20px; border-radius: 15px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🦫 ТЕСТ ВИКТОРИНЫ (без картинок и аудио)</h1>
    <p>Если это открылось быстро — значит проблема в файлах, а не в коде.</p>
    
    <div class="question" id="q">
        <h2>Вопрос 1: Где находятся герой и бобёр?</h2>
        <button class="btn" onclick="check(this, false)">В бобровой хатке</button>
        <button class="btn" onclick="check(this, false)">На пне в лесу</button>
        <button class="btn" onclick="check(this, true)">За столом ✅</button>
        <button class="btn" onclick="check(this, false)">В баре</button>
    </div>
    
    <div id="result"></div>

    <script>
        function check(btn, isCorrect) {
            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
            if (isCorrect) {
                btn.classList.add('correct');
                document.getElementById('result').innerHTML = '<h2 style="color:green">✅ ПРАВИЛЬНО!</h2>';
            } else {
                btn.classList.add('wrong');
                document.getElementById('result').innerHTML = '<h2 style="color:red">😢 Неправильно!</h2>';
            }
        }
    </script>
</body>
</html>
