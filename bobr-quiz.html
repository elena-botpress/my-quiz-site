<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Угадай мелодию!</title>
    <style>
        /* --- СТИЛИ (Дизайн) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif; 
            background: linear-gradient(135deg, #B5C4A8 0%, #E8D98C 50%, #7A9E6B 100%); 
            min-height: 100vh; 
            overflow-x: hidden; 
            color: #2D4A2D;
        }

        /* Экран приветствия */
        .screen-intro { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            text-align: center; 
        }
        
        .intro-title { 
            font-size: clamp(2rem, 5vw, 3.5rem); 
            font-weight: 900; 
            margin-bottom: 20px; 
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5); 
        }
        
        .intro-cover { 
            max-width: 400px; 
            width: 90%; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(45,74,45,0.3); 
            margin-bottom: 30px; 
            border: 5px solid #fff; 
            background: white;
        }

        .btn-start { 
            background: #2D4A2D; 
            color: #fff; 
            border: none; 
            padding: 15px 50px; 
            font-size: 1.5rem; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: transform 0.2s, background 0.2s; 
            box-shadow: 0 5px 15px rgba(45,74,45,0.4); 
            font-weight: bold;
        }
        .btn-start:hover { transform: scale(1.05); background: #3e633e; }

        /* Экран викторины */
        .screen-quiz { 
            display: none; 
            min-height: 100vh; 
            padding: 20px; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }
        
        .quiz-header { text-align: center; margin-bottom: 20px; color: #2D4A2D; font-weight: bold; font-size: 1.2rem; }
        
        .player-card { 
            background: #fff; 
            padding: 30px; 
            border-radius: 30px; 
            width: 100%; 
            max-width: 600px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            text-align: center; 
            margin-bottom: 20px; 
            border: 4px solid #7A9E6B; 
        }
        
        .audio-btn { 
            background: linear-gradient(45deg, #ff2a6d, #bc13fe); 
            color: white; 
            border: none; 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            font-size: 2rem; 
            cursor: pointer; 
            margin-bottom: 20px; 
            box-shadow: 0 5px 20px rgba(188,19,254,0.4); 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            transition: transform 0.1s;
        }
        .audio-btn:active { transform: scale(0.95); }
        
        .question-text { font-size: 1.3rem; color: #555; margin-bottom: 25px; font-weight: bold; }
        
        .options-grid { display: grid; gap: 12px; width: 100%; }
        
        .option-btn { 
            background: #f0f4f8; 
            border: 2px solid #B5C4A8; 
            padding: 15px; 
            border-radius: 15px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            transition: all 0.2s; 
            color: #2D4A2D; 
            font-weight: bold; 
            text-align: left;
        }
        .option-btn:hover:not(:disabled) { background: #E8D98C; border-color: #8B5A2B; transform: translateX(5px); }
        
        .option-btn.correct { background: #7A9E6B !important; color: white !important; border-color: #2D4A2D !important; }
        .option-btn.wrong { background: #ffcccc !important; color: #a00 !important; border-color: #ffaaaa !important; }
        .option-btn:disabled { cursor: default; opacity: 0.9; }

        .btn-next { 
            margin-top: 20px; 
            background: #2D4A2D; 
            color: white; 
            border: none; 
            padding: 12px 40px; 
            border-radius: 25px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            display: none; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-next:hover { background: #3e633e; }

        /* Экран результатов */
        .screen-result { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            text-align: center; 
            padding: 20px;
        }
        .result-score { font-size: 5rem; color: #2D4A2D; font-weight: 900; margin: 20px 0; }
        .result-msg { font-size: 1.5rem; color: #2D4A2D; margin-bottom: 30px; max-width: 600px; line-height: 1.4; }

        @media (max-width: 600px) {
            .intro-title { font-size: 2rem; }
            .player-card { padding: 20px; }
            .option-btn { font-size: 1rem; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ОБЛОЖКА -->
    <div class="screen-intro" id="screenIntro">
        <h1 class="intro-title">🎧 Угадай мелодию!</h1>
        <!-- Картинка cover.png должна лежать рядом с этим файлом -->
        <img src="cover.png" alt="Music Quiz" class="intro-cover"> 
        <p style="color: #2D4A2D; margin-bottom: 30px; font-size: 1.2rem; font-weight: bold;">Слушай отрывок и выбирай правильный ответ!</p>
        <button class="btn-start" onclick="startQuiz()">▶️ Начать квиз</button>
    </div>

    <!-- ЭКРАН 2: ВОПРОСЫ -->
    <div class="screen-quiz" id="screenQuiz">
        <div class="quiz-header">
            <h2>Вопрос <span id="qCurrent">1</span> из <span id="qTotal">5</span></h2>
        </div>
        
        <div class="player-card">
            <!-- Кнопка плеера -->
            <button class="audio-btn" id="playBtn" onclick="toggleAudio()">▶</button>
            <div class="question-text">Какая песня играет?</div>
            
            <div class="options-grid" id="optionsContainer">
                <!-- Кнопки ответов генерируются скриптом -->
            </div>
        </div>
        
        <button class="btn-next" id="btnNext" onclick="nextQuestion()">Дальше ➡</button>
    </div>

    <!-- ЭКРАН 3: ФИНАЛ -->
    <div class="screen-result" id="screenResult">
        <h1 style="font-size: 3rem; color: #2D4A2D;">🎉 Квиз завершен!</h1>
        <div class="result-score"><span id="finalScore">0</span> / <span id="totalScore">5</span></div>
        <p id="finalMessage" class="result-msg"></p>
        <button class="btn-start" onclick="location.reload()">🔄 Сыграть ещё раз</button>
    </div>

    <!-- СКРИПТ ЛОГИКИ -->
    <script>
        // === НАСТРОЙКИ ВОПРОСОВ ===
        // Здесь вы связываете файлы 1.mp3, 2.mp3 с вариантами ответов.
        // correct: 0 — это первый вариант, 1 — второй, 2 — третий.
        
        const quizData = [
            {
                audioFile: '1.mp3', 
                correct: 0, 
                options: ['Название песни 1 (Правильное)', 'Неправильный вариант А', 'Неправильный вариант Б']
            },
            {
                audioFile: '2.mp3',
                correct: 1,
                options: ['Неправильный вариант', 'Название песни 2 (Правильное)', 'Неправильный вариант']
            },
            {
                audioFile: '3.mp3',
                correct: 2,
                options: ['Неправильный вариант', 'Неправильный вариант', 'Название песни 3 (Правильное)']
            },
            {
                audioFile: '4.mp3',
                correct: 0,
                options: ['Название песни 4 (Правильное)', 'Неправильный вариант', 'Неправильный вариант']
            },
            {
                audioFile: '5.mp3',
                correct: 1,
                options: ['Неправильный вариант', 'Название песни 5 (Правильное)', 'Неправильный вариант']
            }
            // Можно добавить еще блоки {...}, используя 6.mp3, 7.mp3 и т.д.
        ];

        let currentQ = 0;
        let score = 0;
        let currentAudio = new Audio(); // Создаем объект аудио

        function startQuiz() {
            document.getElementById('screenIntro').style.display = 'none';
            document.getElementById('screenQuiz').style.display = 'flex';
            document.getElementById('qTotal').innerText = quizData.length;
            document.getElementById('totalScore').innerText = quizData.length;
            loadQuestion();
        }

        function loadQuestion() {
            const data = quizData[currentQ];
            document.getElementById('qCurrent').innerText = currentQ + 1;
            document.getElementById('btnNext').style.display = 'none';
            document.getElementById('playBtn').innerText = '▶';
            
            // Загружаем нужный файл
            currentAudio.src = data.audioFile;
            currentAudio.load();

            // Генерация кнопок
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                container.appendChild(btn);
            });
        }

        function toggleAudio() {
            const btn = document.getElementById('playBtn');
            if (currentAudio.paused) {
                currentAudio.play().catch(e => console.log("Ошибка воспроизведения:", e));
                btn.innerText = '';
            } else {
                currentAudio.pause();
                btn.innerText = '▶';
            }
        }

        function checkAnswer(selectedIndex, btnElement) {
            const data = quizData[currentQ];
            const buttons = document.querySelectorAll('.option-btn');
            
            // Блокируем все кнопки
            buttons.forEach(b => b.disabled = true);
            
            // Останавливаем музыку
            currentAudio.pause();
            document.getElementById('playBtn').innerText = '▶';

            if (selectedIndex === data.correct) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                // Подсвечиваем правильный ответ
                buttons[data.correct].classList.add('correct');
            }
            
            document.getElementById('btnNext').style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('screenQuiz').style.display = 'none';
            document.getElementById('screenResult').style.display = 'flex';
            document.getElementById('finalScore').innerText = score;
            
            const msg = document.getElementById('finalMessage');
            const percentage = (score / quizData.length) * 100;
            
            if(percentage === 100) msg.innerText = " Идеально! Ты настоящий музыкальный гений!";
            else if(percentage >= 80) msg.innerText = "🎹 Отличный слух! Почти без ошибок!";
            else if(percentage >= 50) msg.innerText = "🎻 Неплохо, но можно лучше!";
            else msg.innerText = "🥁 Попробуй еще раз, у тебя обязательно получится!";
        }
    </script>
</body>
</html>
