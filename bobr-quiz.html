<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бобровая Викторина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@300;400;600&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151b2d;
            --accent-gold: #d4af37;
            --accent-red: #e63946;
            --accent-green: #2ecc71;
            --accent-blue: #457b9d;
            --text-primary: #f1faee;
            --text-secondary: #a8dadc;
            --card-bg: rgba(21, 27, 45, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== МУЗЫКАЛЬНЫЙ ПЛЕЕР ===== */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--accent-gold);
            border-radius: 50px;
            padding: 8px 18px;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .music-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b8962e 100%);
            color: var(--bg-primary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .music-btn:hover { transform: scale(1.1); }
        .music-btn.playing { animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(212, 175, 55, 0.8); }
        }

        .music-label {
            font-family: 'Special Elite', cursive;
            font-size: 0.75rem;
            color: var(--accent-gold);
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 18px;
        }

        .eq-bar {
            width: 3px;
            background: var(--accent-gold);
            border-radius: 2px;
        }

        .eq-bar:nth-child(1) { animation: eq1 0.8s ease-in-out infinite; }
        .eq-bar:nth-child(2) { animation: eq2 0.6s ease-in-out infinite; }
        .eq-bar:nth-child(3) { animation: eq3 0.9s ease-in-out infinite; }
        .eq-bar:nth-child(4) { animation: eq4 0.7s ease-in-out infinite; }
        .eq-bar:nth-child(5) { animation: eq5 0.85s ease-in-out infinite; }

        @keyframes eq1 { 0%, 100% { height: 4px; } 50% { height: 16px; } }
        @keyframes eq2 { 0%, 100% { height: 8px; } 50% { height: 5px; } }
        @keyframes eq3 { 0%, 100% { height: 12px; } 50% { height: 7px; } }
        @keyframes eq4 { 0%, 100% { height: 6px; } 50% { height: 18px; } }
        @keyframes eq5 { 0%, 100% { height: 10px; } 50% { height: 4px; } }

        .equalizer.paused .eq-bar {
            animation-play-state: paused;
            height: 4px !important;
        }

        /* ===== ЗАГОЛОВОК ===== */
        header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 2px solid var(--accent-gold);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);
        }

        .badge {
            display: inline-block;
            background: var(--accent-red);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-family: 'Special Elite', cursive;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Crimson Text', serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-family: 'Special Elite', cursive;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 20px;
        }

        /* ===== ПРОГРЕСС БАР ===== */
        .progress-container {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-text {
            font-family: 'Special Elite', cursive;
            color: var(--accent-gold);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-green));
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* ===== ВОПРОС ===== */
        .question-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-image-container {
            width: 100%;
            max-height: 400px;
            overflow: hidden;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .question-body {
            padding: 20px 25px 25px;
        }

        .question-number {
            font-family: 'Special Elite', cursive;
            color: var(--accent-gold);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        /* ===== ВАРИАНТЫ ОТВЕТОВ ===== */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-primary);
            font-size: 1rem;
            text-align: left;
            width: 100%;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.1);
            transform: translateX(5px);
        }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-btn.correct {
            border-color: var(--accent-green);
            background: rgba(46, 204, 113, 0.15);
        }

        .option-btn.correct .option-letter {
            background: var(--accent-green);
            color: white;
        }

        .option-btn.wrong {
            border-color: var(--accent-red);
            background: rgba(230, 57, 70, 0.15);
        }

        .option-btn.wrong .option-letter {
            background: var(--accent-red);
            color: white;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* ===== РЕЗУЛЬТАТ ===== */
        .result-box {
            display: none;
            padding: 18px 20px;
            border-radius: 10px;
            margin-top: 15px;
            animation: slideDown 0.4s ease;
        }

        .result-box.show { display: block; }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 300px; }
        }

        .result-box.success {
            background: rgba(46, 204, 113, 0.15);
            border-left: 4px solid var(--accent-green);
        }

        .result-box.error {
            background: rgba(230, 57, 70, 0.15);
            border-left: 4px solid var(--accent-red);
        }

        .result-title {
            font-family: 'Crimson Text', serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .result-box.success .result-title { color: var(--accent-green); }
        .result-box.error .result-title { color: var(--accent-red); }

        .result-explanation {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* ===== КНОПКИ НАВИГАЦИИ ===== */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
        }

        .btn-nav {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-next {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b8962e 100%);
            color: var(--bg-primary);
            display: none;
        }

        .btn-next.visible { display: inline-flex; }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-prev {
            background: transparent;
            border: 2px solid var(--text-secondary);
            color: var(--text-secondary);
        }

        .btn-prev:hover {
            background: var(--text-secondary);
            color: var(--bg-primary);
        }

        .score-display {
            font-family: 'Special Elite', cursive;
            color: var(--accent-gold);
            font-size: 1rem;
        }

        /* ===== ФИНАЛЬНАЯ СТРАНИЦА ===== */
        .final-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.8s ease;
        }

        .final-screen.active { display: block; }

        .final-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .final-title {
            font-family: 'Crimson Text', serif;
            font-size: 2.2rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .final-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-restart {
            padding: 14px 35px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b8962e 100%);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 40px;
            padding-bottom: 80px;
        }

        @media (max-width: 768px) {
            .question-image-container { max-height: 280px; }
            .question-text { font-size: 1.05rem; }
            .music-player {
                bottom: 10px;
                right: 10px;
                left: 10px;
                justify-content: center;
                padding: 6px 12px;
            }
            .music-label { display: none; }
            .nav-buttons { flex-wrap: wrap; }
            .score-display { order: -1; width: 100%; text-align: center; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

<!-- Фоновая музыка для викторины -->
<audio id="quizMusic" preload="none">
    <source src="" type="audio/mpeg">
</audio>

<!-- Финальная музыка -->
<audio id="endMusic" preload="none">
    <source src="end.mp3" type="audio/mpeg">
</audio>

<!-- Мини-плеер -->
<div class="music-player" id="miniPlayer">
    <button class="music-btn" id="playBtn" onclick="toggleMiniMusic()">▶️</button>
    <div class="equalizer paused" id="equalizer">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    </div>
    <span class="music-label" id="trackLabel">Саундтрек</span>
</div>

<header>
    <div class="badge">🦫 БОБРОВАЯ ВИКТОРИНА</div>
    <h1>Песня про Бобра</h1>
    <p class="subtitle">Проверь свои знания о главном мемном хите!</p>
</header>

<div class="container">

    <!-- Прогресс бар -->
    <div class="progress-container" id="progressContainer">
        <span class="progress-text" id="progressText">Вопрос 1 / 15</span>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="score-display" id="liveScore">⭐ 0 баллов</span>
    </div>

    <!-- Контейнер вопроса -->
    <div id="quizArea"></div>

    <!-- Финальный экран -->
    <div class="final-screen" id="finalScreen">
        <div class="final-icon" id="finalIcon">🏆</div>
        <h2 class="final-title" id="finalTitle">Викторина завершена!</h2>
        <div class="final-score" id="finalScore">0 / 15</div>
        <p class="final-message" id="finalMessage"></p>
        <button class="btn-restart" onclick="restartQuiz()">🔄 Пройти заново</button>
    </div>

</div>

<footer>
    <p style="font-family: 'Special Elite', cursive; margin-bottom: 5px;">🦫 БОБРОВАЯ ВИКТОРИНА © 2026</p>
    <p>Ни один бобр не пострадал при создании этой викторины.</p>
</footer>

// ===========================

        audio: "14.mp3",
        options: ["«Скажи мне честно, бобёр»", "«Дай в долг до пятницы, бобёр»", "«Не верь, не бойся, не проси, бобёр»", "«Ты кто такой? Давай, до свидания!»"],
        correct: 0,
        explanation: "«Скажи мне честно, бобёр» — максимальный уровень доверия в мире людей и грызунов."
    },
    {
        question: "Какой главный жизненный вывод можно сделать, прослушав эту песню?",
        image: "q15-cinema.png",
        audio: null,
        options: ["Бобры – это опасные хищники, держитесь от них подальше", "Дружба с бобром – это офигенно", "Нужно срочно идти и строить плотину", "Полено – это новый чёрный"],
        correct: 1,
        explanation: "Главный вывод прост: дружба с бобром — это офигенно! 💛"
    }
];

// Карта аудио для каждого вопроса
const audioMap = {
    0: null,      // q01 — нет аудио
    1: "2.mp3",   // q02
    2: "3.mp3",   // q03
    3: "4.mp3",   // q04
    4: null,      // q05
    5: null,      // q06
    6: "7.mp3",   // q07
    7: "8.mp3",   // q08
    8: "9.mp3",   // q09
    9: null,      // q10
    10: null,     // q11
    11: null,     // q12
    12: null,     // q13
    13: "14.mp3", // q14
    14: null      // q15
};

let currentQuestion = 0;
let score = 0;
let answered = new Array(quizData.length).fill(false);
let selectedAnswers = new Array(quizData.length).fill(null);
let miniIsPlaying = false;
let endMusicStarted = false;

const letters = ['А', 'Б', 'В', 'Г'];

// ===========================
// МИНИ-ПЛЕЕР (переключение треков)
// ===========================
function toggleMiniMusic() {
    const btn = document.getElementById('playBtn');
    const eq = document.getElementById('equalizer');
    const label = document.getElementById('trackLabel');

    if (miniIsPlaying) {
        stopAllAudio();
        btn.textContent = '▶️';
        btn.classList.remove('playing');
        eq.classList.add('paused');
        miniIsPlaying = false;
    } else {
        playCurrentTrack();
        btn.textContent = '⏸️';
        btn.classList.add('playing');
        eq.classList.remove('paused');
        miniIsPlaying = true;
    }
}

function playCurrentTrack() {
    const item = quizData[currentQuestion];
    if (item.audio) {
        const quizMusic = document.getElementById('quizMusic');
        quizMusic.src = item.audio;
        quizMusic.volume = 0.4;
        quizMusic.loop = false;
        quizMusic.play().catch(() => {});
        document.getElementById('trackLabel').textContent = '🎧 ' + item.audio;
    }
}

function stopAllAudio() {
    document.getElementById('quizMusic').pause();
    document.getElementById('quizMusic').currentTime = 0;
}

function updateMiniPlayerForQuestion(qIndex) {
    const item = quizData[qIndex];
    const btn = document.getElementById('playBtn');
    const eq = document.getElementById('equalizer');
    const label = document.getElementById('trackLabel');

    // Останавливаем предыдущий трек
    stopAllAudio();

    if (item.audio) {
        btn.style.display = 'flex';
        label.textContent = '🎧 Нажми ▶ для звука';
        if (miniIsPlaying) {
            playCurrentTrack();
            btn.textContent = '⏸️';
            btn.classList.add('playing');
            eq.classList.remove('paused');
        } else {
            btn.textContent = '▶️';
            btn.classList.remove('playing');
            eq.classList.add('paused');
        }
    } else {
        btn.style.display = 'none';
        label.textContent = '';
        miniIsPlaying = false;
    }
}

// ===========================
// ОТРИСОВКА ВОПРОСА
// ===========================
function renderQuestion(index) {
    const data = quizData[index];
    const area = document.getElementById('quizArea');

    let optionsHTML = '';
    data.options.forEach((opt, i) => {
        let extraClass = '';
        if (answered[index]) {
            if (i === data.correct) extraClass = 'correct disabled';
            else if (selectedAnswers[index] === i && i !== data.correct) extraClass = 'wrong disabled';
            else extraClass = 'disabled';
        }
        optionsHTML += `
            <button class="option-btn ${extraClass}" 
                    onclick="selectAnswer(${index}, ${i})" 
                    ${answered[index] ? 'disabled' : ''}>
                <span class="option-letter">${letters[i]}</span>
                <span>${opt}</span>
            </button>`;
    });

    let resultHTML = '';
    if (answered[index]) {
        const isCorrect = selectedAnswers[index] === data.correct;
        resultHTML = `
            <div class="result-box show ${isCorrect ? 'success' : 'error'}">
                <div class="result-title">${isCorrect ? '✅ Правильно!' : '❌ Неправильно!'}</div>
                <div class="result-explanation">${data.explanation}</div>
            </div>`;
    }

    const nextVisible = answered[index] ? 'visible' : '';
    const prevDisabled = index === 0 ? 'style="visibility:hidden"' : '';
    const isLast = index === quizData.length - 1;
    const nextLabel = isLast ? '🏁 Завершить' : '➡️ Далее';

    area.innerHTML = `
        <div class="question-card">
            <div class="question-image-container">
                <img src="${data.image}" alt="Вопрос ${index + 1}" class="question-image" loading="lazy" 
                     onerror="this.parentElement.innerHTML='<div style=&quot;padding:40px;color:#aaa;font-style:italic;&quot;>🖼️ Изображение недоступно</div>'">
            </div>
            <div class="question-body">
                <div class="question-number">ВОПРОС ${index + 1} ИЗ ${quizData.length}</div>
                <div class="question-text">${data.question}</div>
                <div class="options-list">${optionsHTML}</div>
                ${resultHTML}
                <div class="nav-buttons">
                    <button class="btn-nav btn-prev" onclick="prevQuestion()" ${prevDisabled}>← Назад</button>
                    <span class="score-display">⭐ ${score} баллов</span>
                    <button class="btn-nav btn-next ${nextVisible}" onclick="nextQuestion()">${nextLabel}</button>
                </div>
            </div>
        </div>`;

    // Обновляем прогресс
    document.getElementById('progressText').textContent = `Вопрос ${index + 1} / ${quizData.length}`;
    document.getElementById('progressFill').style.width = ((index + 1) / quizData.length * 100) + '%';
    document.getElementById('liveScore').textContent = `⭐ ${score} баллов`;

    // Обновляем мини-плеер
    updateMiniPlayerForQuestion(index);
}

// ===========================
// ЛОГИКА ОТВЕТОВ
// ===========================
function selectAnswer(qIndex, optIndex) {
    if (answered[qIndex]) return;

    answered[qIndex] = true;
    selectedAnswers[qIndex] = optIndex;

    if (optIndex === quizData[qIndex].correct) {
        score++;
    }

    renderQuestion(qIndex);
}

function nextQuestion() {
    if (!answered[currentQuestion]) return;

    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        renderQuestion(currentQuestion);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
        showFinalScreen();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion(currentQuestion);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// ===========================
// ФИНАЛЬНЫЙ ЭКРАН
// ===========================
function showFinalScreen() {
    stopAllAudio();
    document.getElementById('quizArea').innerHTML = '';
    document.getElementById('progressContainer').style.display = 'none';
    document.getElementById('finalScreen').classList.add('active');

    const pct = Math.round(score / quizData.length * 100);
    document.getElementById('finalScore').textContent = `${score} / ${quizData.length}`;

    let icon, title, message;
    if (pct >= 90) {
        icon = '👑'; title = 'Легенда бобровой дружбы!';
        message = 'Вы знаете эту песню наизусть. Бобр гордится вами!';
    } else if (pct >= 70) {
        icon = '🦫'; title = 'Отличный результат!';
        message = 'Вы почти настоящий друг бобра. Ещё чуть-чуть практики!';
    } else if (pct >= 50) {
        icon = '🤔'; title = 'Неплохо, но есть куда расти';
        message = 'Переслушайте песню и попробуйте снова. Бобр ждёт вас!';
    } else {
        icon = '😅'; title = 'Бобр немного расстроен...';
        message = 'Включайте песню заново и возвращайтесь. Мы верим в вас!';
    }

    document.getElementById('finalIcon').textContent = icon;
    document.getElementById('finalTitle').textContent = title;
    document.getElementById('finalMessage').textContent = message;

    // Автоматически включаем финальную музыку
    if (!endMusicStarted) {
        endMusicStarted = true;
        setTimeout(() => {
            const endAudio = document.getElementById('endMusic');
            endAudio.volume = 0.5;
            endAudio.loop = true;
            endAudio.play().then(() => {
                const btn = document.getElementById('playBtn');
                const eq = document.getElementById('equalizer');
                const label = document.getElementById('trackLabel');
                btn.style.display = 'flex';
                btn.textContent = '⏸️';
                btn.classList.add('playing');
                eq.classList.remove('paused');
                label.textContent = '🎬 Финальные титры';
                miniIsPlaying = true;

                // При клике на кнопку останавливаем/возобновляем end.mp3
                btn.onclick = () => {
                    if (endAudio.paused) {
                        endAudio.play();
                        btn.textContent = '⏸️';
                        btn.classList.add('playing');
                        eq.classList.remove('paused');
                        miniIsPlaying = true;
                    } else {
                        endAudio.pause();
                        btn.textContent = '▶️';
                        btn.classList.remove('playing');
                        eq.classList.add('paused');
                        miniIsPlaying = false;
                    }
                };
            }).catch(() => {
                console.log('End music autoplay blocked by browser');
            });
        }, 1000);
    }
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    answered.fill(false);
    selectedAnswers.fill(null);
    endMusicStarted = false;

    stopAllAudio();
    const endAudio = document.getElementById('endMusic');
    endAudio.pause();
    endAudio.currentTime = 0;

    document.getElementById('finalScreen').classList.remove('active');
    document.getElementById('progressContainer').style.display = 'flex';

    const btn = document.getElementById('playBtn');
    btn.onclick = toggleMiniMusic;

    renderQuestion(0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===========================
// СТАРТ
// ===========================
renderQuestion(0);
</script>

</html>
